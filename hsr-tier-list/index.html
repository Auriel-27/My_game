<style>

*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 0% 0%,#283877 0,#111831 38%,#070a14 76%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(140deg,rgba(143,166,255,.10),transparent 42%,rgba(226,128,255,.08));pointer-events:none}.app{position:relative;min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);box-shadow:0 18px 60px rgba(0,0,0,.24);backdrop-filter:blur(16px)}header{padding:16px}h1{font-size:21px;line-height:1.15;margin:0 0 8px}.sub{font-size:13px;line-height:1.55;color:var(--muted);margin:0}.top-actions{display:flex;gap:10px;margin-top:13px}.btn,input,select{font:inherit;color:var(--text);border:1px solid var(--line);background:rgba(12,17,34,.86);border-radius:14px;min-height:46px;padding:0 13px;outline:none}.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.btn.danger{border-color:rgba(255,120,152,.45);color:#ffd8e0}.btn.small{min-height:36px;padding:0 10px;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px;margin:0 0 12px}.count{color:#d9e2ff}.board{padding:14px}.tier{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;margin:0 0 10px}.tier-label{min-height:72px;border-radius:16px;display:grid;place-items:center;font-weight:900;letter-spacing:.4px;border:1px solid rgba(255,255,255,.12);font-size:14px}.label-P0{background:linear-gradient(135deg,#775119,#9c62e8)}.label-P1{background:linear-gradient(135deg,#5736a8,#2856d0)}.label-P2{background:linear-gradient(135deg,#214ca1,#1891b4)}.label-P3{background:linear-gradient(135deg,#15596e,#286a56)}.label-P4{background:linear-gradient(135deg,#42506a,#263046)}.label-P5{background:linear-gradient(135deg,#383c4d,#191e2e)}.dropzone{min-height:72px;border:1px dashed rgba(166,186,255,.30);background:rgba(8,12,26,.50);border-radius:16px;padding:7px;display:flex;gap:7px;align-items:flex-start;align-content:flex-start;flex-wrap:wrap}.dropzone.empty:after{content:"点击下方头像放到这里";color:rgba(220,228,255,.38);font-size:12px;margin:auto}.dropzone.drag-over{border-color:#d5ddff;background:rgba(108,130,220,.18)}.tools{padding:14px}.filter-grid{display:grid;grid-template-columns:1fr;gap:10px}.filter-label{font-size:12px;color:var(--muted);margin:0 0 6px 2px}.field-wrap{position:relative}.field-wrap select,.field-wrap input{width:100%;appearance:none;-webkit-appearance:none}.field-wrap.select:after{content:"⌄";position:absolute;right:14px;bottom:11px;color:var(--muted);pointer-events:none}.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 0}.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(16,22,43,.75);color:var(--soft);border-radius:999px;min-height:34px;padding:0 12px;font-size:13px}.pool{padding:14px}.character-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:9px}.char{width:var(--tile);height:var(--tile);border-radius:14px;border:1px solid rgba(176,196,255,.30);background:linear-gradient(135deg,rgba(82,105,181,.95),rgba(38,46,82,.95));display:grid;place-items:center;position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.24);overflow:hidden}.char:active{transform:scale(.97)}.char .avatar{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.24),transparent 32%),linear-gradient(135deg,var(--c1),var(--c2))}.char img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.char .rarity{position:absolute;top:4px;right:5px;font-size:9px;color:#ffeaa1;text-shadow:0 1px 5px #000}.char .mini{position:absolute;left:4px;bottom:4px;right:4px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;background:rgba(0,0,0,.38);border-radius:7px;padding:2px 3px}.char.hidden{display:none}.modal{position:fixed;inset:0;display:none;place-items:end center;background:rgba(0,0,0,.45);z-index:20;padding:14px}.modal.show{display:grid}.sheet{width:min(540px,100%);border:1px solid var(--line);background:rgba(13,18,36,.97);border-radius:24px;padding:15px;box-shadow:0 24px 90px rgba(0,0,0,.55)}.sheet h2{font-size:18px;margin:2px 0 5px}.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px}.tier-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(12,16,31,.94);border:1px solid var(--line);padding:10px 14px;border-radius:999px;color:#dbe4ff;font-size:13px;display:none;z-index:30}.toast.show{display:block}@media (min-width:860px){:root{--tile:64px}.app{padding:18px}.desktop-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}.tools{order:0}.pool{position:sticky;top:18px}.character-grid{max-height:calc(100dvh - 210px);overflow:auto}.tier{grid-template-columns:60px minmax(0,1fr)}.tier-label,.dropzone{min-height:82px}.filter-grid{grid-template-columns:1fr 1fr 1fr}.top-actions{width:auto}.btn.reset{max-width:180px}}@media (max-width:420px){:root{--tile:56px}.app{padding:10px}header{padding:14px}h1{font-size:20px}.tier{grid-template-columns:48px minmax(0,1fr)}.tier-label,.dropzone{min-height:68px}.top-actions .btn{flex:1}.section-title{font-size:13px}}

<body>
<div class="app">
  <header class="card">
    <h1>星穹铁道角色喜好排行榜</h1>
    <p class="sub">手机上直接点角色头像，然后选择 P0-P5。头像默认从网上读取，不需要你一个个下载；如果图片没加载出来，会显示文字占位。</p>
    <div class="top-actions"><button class="btn danger reset" id="resetBtn">清空排行榜</button></div>
  </header>

  <div class="desktop-grid">
    <section class="board card">
      <div class="section-title"><span>排行榜</span><span class="count" id="rankedCount">已排序 0</span></div>
      <div id="tiers">
        <div class="tier"><div class="tier-label label-P0">P0</div><div class="dropzone empty" data-zone="P0"></div></div>
        <div class="tier"><div class="tier-label label-P1">P1</div><div class="dropzone empty" data-zone="P1"></div></div>
        <div class="tier"><div class="tier-label label-P2">P2</div><div class="dropzone empty" data-zone="P2"></div></div>
        <div class="tier"><div class="tier-label label-P3">P3</div><div class="dropzone empty" data-zone="P3"></div></div>
        <div class="tier"><div class="tier-label label-P4">P4</div><div class="dropzone empty" data-zone="P4"></div></div>
        <div class="tier"><div class="tier-label label-P5">P5</div><div class="dropzone empty" data-zone="P5"></div></div>
      </div>
    </section>

    <div>
      <section class="tools card">
        <div class="section-title"><span>搜索与筛选</span><button class="btn small" id="clearFilterBtn">清除筛选</button></div>
        <div class="filter-grid">
          <div><div class="filter-label">搜索角色</div><div class="field-wrap"><input id="searchInput" placeholder="黄泉 / Acheron" /></div></div>
          <div><div class="filter-label">命途</div><div class="field-wrap select"><select id="pathFilter"></select></div></div>
          <div><div class="filter-label">属性</div><div class="field-wrap select"><select id="elementFilter"></select></div></div>
        </div>
        <div class="chips" aria-label="推荐搜索">
          <button class="chip" data-q="黄泉">黄泉</button><button class="chip" data-q="流萤">流萤</button><button class="chip" data-q="卡芙卡">卡芙卡</button><button class="chip" data-q="三月七">三月七</button>
        </div>
      </section>

      <section class="pool card" style="margin-top:14px">
        <div class="section-title"><span>角色头像池</span><span class="count" id="poolCount">加载中</span></div>
        <div class="character-grid dropzone" id="pool" data-zone="pool"></div>
      </section>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">选择梯队</h2><p id="modalMeta"></p><div class="tier-buttons" id="tierButtons"></div></div></div>
<div class="toast" id="toast"></div>
<script>

const raw=[
["Acheron",5,"Nihility","Lightning","2.1"],["Aglaea",5,"Remembrance","Lightning","3.0"],["Anaxa",5,"Erudition","Wind","3.2"],["Archer",5,"The Hunt","Quantum","3.4"],["Argenti",5,"Erudition","Physical","1.5"],["Arlan",4,"Destruction","Lightning","1.0"],["Ashveil",5,"The Hunt","Lightning","4.1"],["Asta",4,"Harmony","Fire","1.0"],["Aventurine",5,"Preservation","Imaginary","2.1"],["Bailu",5,"Abundance","Lightning","1.0"],["Black Swan",5,"Nihility","Wind","2.0"],["Blade",5,"Destruction","Wind","1.2"],["Boothill",5,"The Hunt","Physical","2.2"],["Bronya",5,"Harmony","Wind","1.0"],["Castorice",5,"Remembrance","Quantum","3.2"],["Cerydra",5,"Harmony","Wind","3.5"],["Cipher",5,"Nihility","Quantum","3.3"],["Clara",5,"Destruction","Physical","1.0"],["Cyrene",5,"Remembrance","Ice","3.7"],["Dan Heng",4,"The Hunt","Wind","1.0"],["Dan Heng • Imbibitor Lunae",5,"Destruction","Imaginary","1.3"],["Dan Heng • Permansor Terrae",5,"Preservation","Physical","3.6"],["Dr. Ratio",5,"The Hunt","Imaginary","1.6"],["Evanescia",5,"Elation","Physical","4.2"],["Evernight",5,"Remembrance","Ice","3.6"],["Feixiao",5,"The Hunt","Wind","2.5"],["Firefly",5,"Destruction","Fire","2.3"],["Fu Xuan",5,"Preservation","Quantum","1.3"],["Fugue",5,"Nihility","Fire","2.7"],["Gallagher",4,"Abundance","Fire","2.1"],["Gepard",5,"Preservation","Ice","1.0"],["Guinaifen",4,"Nihility","Fire","1.4"],["Hanya",4,"Harmony","Physical","1.5"],["Herta",4,"Erudition","Ice","1.0"],["Himeko",5,"Erudition","Fire","1.0"],["Hook",4,"Destruction","Fire","1.0"],["Huohuo",5,"Abundance","Wind","1.5"],["Hyacine",5,"Remembrance","Wind","3.3"],["Hysilens",5,"Nihility","Physical","3.5"],["Jade",5,"Erudition","Quantum","2.3"],["Jiaoqiu",5,"Nihility","Fire","2.4"],["Jing Yuan",5,"Erudition","Lightning","1.0"],["Jingliu",5,"Destruction","Ice","1.4"],["Kafka",5,"Nihility","Lightning","1.2"],["Lingsha",5,"Abundance","Fire","2.5"],["Luka",4,"Nihility","Physical","1.2"],["Luocha",5,"Abundance","Imaginary","1.1"],["Lynx",4,"Abundance","Quantum","1.3"],["March 7th",4,"Preservation","Ice","1.0"],["March 7th (The Hunt)",4,"The Hunt","Imaginary","2.4"],["Misha",4,"Destruction","Ice","2.0"],["Moze",4,"The Hunt","Lightning","2.5"],["Mydei",5,"Destruction","Imaginary","3.1"],["Natasha",4,"Abundance","Physical","1.0"],["Pela",4,"Nihility","Ice","1.0"],["Phainon",5,"Destruction","Physical","3.4"],["Qingque",4,"Erudition","Quantum","1.0"],["Rappa",5,"Erudition","Imaginary","2.6"],["Robin",5,"Harmony","Physical","2.2"],["Ruan Mei",5,"Harmony","Ice","1.6"],["Saber",5,"Destruction","Wind","3.4"],["Sampo",4,"Nihility","Wind","1.0"],["Seele",5,"The Hunt","Quantum","1.0"],["Serval",4,"Erudition","Lightning","1.0"],["Silver Wolf",5,"Nihility","Quantum","1.1"],["Silver Wolf LV.999",5,"Elation","Imaginary","4.2"],["Sparkle",5,"Harmony","Quantum","2.0"],["Sparxie",5,"Elation","Fire","4.0"],["Sunday",5,"Harmony","Imaginary","2.7"],["Sushang",4,"The Hunt","Physical","1.0"],["The Dahlia",5,"Nihility","Fire","3.8"],["The Herta",5,"Erudition","Ice","3.0"],["Tingyun",4,"Harmony","Lightning","1.0"],["Topaz & Numby",5,"The Hunt","Fire","1.4"],["Trailblazer (Destruction)",5,"Destruction","Physical","1.0"],["Trailblazer (Preservation)",5,"Preservation","Fire","1.0"],["Trailblazer (Harmony)",5,"Harmony","Imaginary","2.2"],["Trailblazer (Remembrance)",5,"Remembrance","Ice","3.0"],["Trailblazer (Elation)",5,"Elation","Lightning","4.2"],["Tribbie",5,"Harmony","Quantum","3.1"],["Welt",5,"Nihility","Imaginary","1.0"],["Xueyi",4,"Destruction","Quantum","1.6"],["Yanqing",5,"The Hunt","Ice","1.0"],["Yao Guang",5,"Elation","Physical","4.0"],["Yukong",4,"Harmony","Imaginary","1.1"],["Yunli",5,"Destruction","Physical","2.4"]

const slug=s=>s.toLowerCase().replace(/•/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const colors={Physical:["#b38b66","#65503f"],Fire:["#f06c4f","#68212b"],Ice:["#8fd8ff","#295476"],Lightning:["#b178ff","#44206e"],Wind:["#56d4aa","#1e5b58"],Quantum:["#6f7dff","#2e286c"],Imaginary:["#f0cf75","#71551f"]};
function fandomIconUrl(name){return 'https://honkai-star-rail.fandom.com/wiki/Special:Redirect/file/Character_'+encodeURIComponent(name.replace(/ /g,'_'))+'_Icon.png';}
const characters=raw.map(([nameEn,rarity,path,element,version])=>({id:slug(nameEn),nameCn:cnNames[nameEn]||nameEn,nameEn,rarity,path,pathCn:pathCn[path],element,elementCn:elementCn[element],version,avatar:fandomIconUrl(nameEn)}));

var STORAGE_KEY='hsrTierStateV42_v2';
var state;
try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){state=null;}
if(!state){state={pool:characters.map(function(c){return c.id;}),tiers:{P0:[],P1:[],P2:[],P3:[],P4:[],P5:[]}};}
var selectedId=null,dragId=null;
function qs(s){return document.querySelector(s)}
function qsa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function normalize(){var known={};characters.forEach(function(c){known[c.id]=true});var seen={};function clean(arr){var out=[];(arr||[]).forEach(function(id){if(known[id]&&!seen[id]){seen[id]=true;out.push(id)}});return out}state.pool=clean(state.pool);tiers.forEach(function(t){if(!state.tiers)state.tiers={};state.tiers[t]=clean(state.tiers[t])});characters.forEach(function(c){if(!seen[c.id])state.pool.push(c.id)})}
function findChar(id){for(var i=0;i<characters.length;i++){if(characters[i].id===id)return characters[i]}return null}
function makeChar(id){var c=findChar(id);var el=document.createElement('button');el.type='button';el.className='char';el.draggable=true;el.dataset.id=id;var cs=colors[c.element]||['#7d8cff','#35406d'];el.style.setProperty('--c1',cs[0]);el.style.setProperty('--c2',cs[1]);el.title=c.nameCn+' / '+c.nameEn+'\n'+c.pathCn+' · '+c.elementCn+' · '+c.rarity+'星 · v'+c.version;var shortName=(c.nameCn||c.nameEn).slice(0,2);el.innerHTML='<div class="avatar">'+shortName+'</div><img src="'+c.avatar+'" alt="'+c.nameCn+'" loading="lazy" onerror="this.remove()"><span class="rarity">'+'★'.repeat(c.rarity)+'</span><span class="mini">'+c.nameCn+'</span>';el.addEventListener('click',function(){openMenu(id)});el.addEventListener('dragstart',function(e){dragId=id;if(e.dataTransfer)e.dataTransfer.setData('text/plain',id)});return el}
function renderFilters(){var pf=qs('#pathFilter'),ef=qs('#elementFilter');if(pf.children.length===0){var html='<option value="all">全部命途</option>';Object.keys(pathCn).forEach(function(k){html+='<option value="'+k+'">'+pathCn[k]+'</option>'});pf.innerHTML=html;html='<option value="all">全部属性</option>';Object.keys(elementCn).forEach(function(k){html+='<option value="'+k+'">'+elementCn[k]+'</option>'});ef.innerHTML=html;}}
function getFilteredIds(){var q=qs('#searchInput').value.trim().toLowerCase();var p=qs('#pathFilter').value;var e=qs('#elementFilter').value;return characters.filter(function(c){return (p==='all'||c.path===p)&&(e==='all'||c.element===e)&&(!q||c.nameCn.toLowerCase().indexOf(q)>-1||c.nameEn.toLowerCase().indexOf(q)>-1)}).map(function(c){return c.id})}
function render(){normalize();renderFilters();tiers.forEach(function(t){var zone=qs('[data-zone="'+t+'"]');zone.innerHTML='';(state.tiers[t]||[]).forEach(function(id){zone.appendChild(makeChar(id))});zone.classList.toggle('empty',zone.children.length===0)});var pool=qs('#pool');pool.innerHTML='';var filtered=getFilteredIds();state.pool.filter(function(id){return filtered.indexOf(id)>-1}).forEach(function(id){pool.appendChild(makeChar(id))});pool.classList.toggle('empty',pool.children.length===0);attachZones();var ranked=tiers.reduce(function(n,t){return n+state.tiers[t].length},0);qs('#rankedCount').textContent='已排序 '+ranked+' / '+characters.length;qs('#poolCount').textContent='显示 '+pool.children.length+' / 剩余 '+state.pool.length;save()}
function removeFromAll(id){state.pool=state.pool.filter(function(x){return x!==id});tiers.forEach(function(t){state.tiers[t]=state.tiers[t].filter(function(x){return x!==id})})}
function moveTo(id,zone,beforeId){if(!id)return;removeFromAll(id);var arr=zone==='pool'?state.pool:state.tiers[zone];var idx=beforeId?arr.indexOf(beforeId):-1;if(idx>=0)arr.splice(idx,0,id);else arr.push(id);render();toast(zone==='pool'?'已移回角色池':'已放入 '+zone)}
function attachZones(){qsa('.dropzone').forEach(function(z){z.ondragover=function(e){e.preventDefault();z.classList.add('drag-over')};z.ondragleave=function(){z.classList.remove('drag-over')};z.ondrop=function(e){e.preventDefault();z.classList.remove('drag-over');var id=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||dragId;var target=e.target.closest?e.target.closest('.char'):null;moveTo(id,z.dataset.zone,target&&target.dataset.id)}})}
function openMenu(id){selectedId=id;var c=findChar(id);qs('#modalTitle').textContent=c.nameCn+' / '+c.nameEn;qs('#modalMeta').textContent=c.pathCn+' · '+c.elementCn+' · '+c.rarity+'星 · 版本 '+c.version;var html='';tiers.forEach(function(t){html+='<button class="btn" data-target="'+t+'">放入 '+t+'</button>'});html+='<button class="btn" data-target="pool">移回角色池</button><button class="btn danger" data-target="close">取消</button>';qs('#tierButtons').innerHTML=html;qs('#modal').classList.add('show')}
qs('#tierButtons').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.dataset.target;qs('#modal').classList.remove('show');if(t!=='close')moveTo(selectedId,t)});
qs('#modal').addEventListener('click',function(e){if(e.target.id==='modal')qs('#modal').classList.remove('show')});
qs('#searchInput').addEventListener('input',render);qs('#pathFilter').addEventListener('change',render);qs('#elementFilter').addEventListener('change',render);
qs('#clearFilterBtn').onclick=function(){qs('#searchInput').value='';qs('#pathFilter').value='all';qs('#elementFilter').value='all';render()};
qsa('.chip').forEach(function(chip){chip.onclick=function(){qs('#searchInput').value=chip.dataset.q;render()}});
qs('#resetBtn').onclick=function(){if(confirm('确认清空当前排行榜吗？')){state={pool:characters.map(function(c){return c.id}),tiers:{P0:[],P1:[],P2:[],P3:[],P4:[],P5:[]}};render()}};
function toast(msg){var t=qs('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.remove('show')},1500)}
try{render()}catch(err){console.error(err);qs('#poolCount').textContent='脚本加载失败，请用 Safari/Chrome 打开，或上传到网页空间后访问。'}
</script>
</body>
